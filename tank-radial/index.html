    <path d="M0 29 Q-6 10 -6 -28L-5.5 -92 Q-5 -117 -2.2 -157L0 -234 L2.2 -157 Q5 -117 5.5 -92L6 -28Q6 10 0 29Z" fill="url(#bluedSteel)" stroke="#0b274a" stroke-width=".7"/>

  <!-- Minimal, unlabeled sensor activation target; invisible interactive hit area. -->
  <g id="sensorButton" role="button" tabindex="0" aria-label="맥북 힌지 센서 연결" focusable="true">
    <circle cx="1564" cy="965" r="23" fill="transparent"/>
    <circle id="sensorLight" cx="1564" cy="965" r="3.6" fill="#a3a59e" opacity=".55"/>

<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const svg=$('#face');
const hr=$('#hourHand'),mn=$('#minuteHand'),sc=$('#secondHand');
const sensorLight=$('#sensorLight');

// Track is a perfect, closed two-rectangle drawing. Only the cross-ties travel.
const ticks=$('#railTicks');
const tickItems=Array.from(ticks.querySelectorAll('line'));
const railCenter={x:257,y:257,w:1086,h:486};
const railPerimeter=2*(railCenter.w+railCenter.h);
const rectPath=(distance)=>{
  const r=railCenter, p=railPerimeter;
  let s=((distance%p)+p)%p;
  if(s<r.w)return {x:r.x+s,y:r.y,nx:0,ny:1};
  s-=r.w;
  if(s<r.h)return {x:r.x+r.w,y:r.y+s,nx:-1,ny:0};
  s-=r.h;
  if(s<r.w)return {x:r.x+r.w-s,y:r.y+r.h,nx:0,ny:-1};
  s-=r.w;
  return {x:r.x,y:r.y+r.h-s,nx:1,ny:0};
};
const drawTicks=(phase)=>{
  const offset=phase*railPerimeter;
  for(let i=0;i<60;i++){
    const d=(i*railPerimeter/60+offset);
    const p=rectPath(d);
    const line=tickItems[i];
    const inset=0.8;
    line.setAttribute('x1',(p.x-p.nx*(13-inset)).toFixed(3));
    line.setAttribute('y1',(p.y-p.ny*(13-inset)).toFixed(3));
    line.setAttribute('x2',(p.x+p.nx*(13-inset)).toFixed(3));
    line.setAttribute('y2',(p.y+p.ny*(13-inset)).toFixed(3));
  }
};

let reserve=.62;  // virtual mechanical reserve, not MacBook battery
let watchTime=Date.now();
let lastFrame=performance.now();
let lastHinge=null;
let audio=null,noise=null,accMotion=0,dragging=false,lastDragY=0;
let sensor=null,pollTimer=null,bridge=null,hasLiveSensor=false;

function audioReady(){
  try {
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!Context)return;
    audio ??= new Context();audio.resume().catch(()=>{});
    if(!noise){
      noise=audio.createBuffer(1,Math.ceil(audio.sampleRate*.055),audio.sampleRate);
      const a=noise.getChannelData(0);
      for(let k=0;k<a.length;k++)a[k]=Math.random()*2-1;
    }
  }catch(e){}
}
function clickRatchet(count=1){
  if(!audio||audio.state!=='running'||!noise)return;
  const now=audio.currentTime;
  for(let i=0;i<Math.min(5,count);i++){
    const at=now+i*.025;
    const src=audio.createBufferSource();src.buffer=noise;
    const band=audio.createBiquadFilter();band.type='bandpass';band.frequency.value=1650+220*(i%3);band.Q.value=1.1;
    const gain=audio.createGain();
    gain.gain.setValueAtTime(.0001,at);
    gain.gain.exponentialRampToValueAtTime(.10,at+.0018);
    gain.gain.exponentialRampToValueAtTime(.0001,at+.035);
    src.connect(band).connect(gain).connect(audio.destination);
    src.start(at);src.stop(at+.041);
  }
}
function windBy(delta){
  const motion=Math.abs(delta);
  if(!Number.isFinite(motion)||motion<.12||motion>38)return;
  reserve=Math.min(1,reserve+motion/610);
  accMotion+=motion;
  if(accMotion>=2.0){
    const n=Math.min(5,Math.floor(accMotion/2));
    accMotion=accMotion%2;
    clickRatchet(n);
  }
}
function useAngle(a){
  if(!Number.isFinite(a)||a<0||a>180)return;
  if(lastHinge!==null)windBy(a-lastHinge);
  lastHinge=a;
  hasLiveSensor=true;
  sensorLight.setAttribute('fill','#3b7692');sensorLight.setAttribute('opacity','.75');
}
function decodeAngle(data){
  // WebHID DataView excludes reportId; native IOKit report may include it.
  if(!data||data.byteLength<2)return null;
  const tries=[];
  for(const pos of [0,1]){
    if(pos+1>=data.byteLength)continue;
    const a=data.getUint16(pos,true);
    if(a>=10&&a<=180)tries.push(a);
    if(a>=1000&&a<=18000)tries.push(a/100);
  }
  if(!tries.length)return null;
  if(lastHinge!==null)tries.sort((a,b)=>Math.abs(a-lastHinge)-Math.abs(b-lastHinge));
  return tries[0];
}
function listenInput(e){
  if(e.reportId!==1)return;
  const ang=decodeAngle(e.data);
  if(ang!==null)useAngle(ang);
}
async function openHidDevice(device){
  if(sensor&&sensor!==device&&sensor.opened){try{await sensor.close()}catch(e){}}
  sensor=device;
  if(!device.opened)await device.open();
  device.addEventListener('inputreport',listenInput);
  if(pollTimer)clearInterval(pollTimer);
  let polling=false;
  pollTimer=setInterval(async()=>{
    if(polling||!device.opened)return;
    polling=true;
    try{
      const report=await device.receiveFeatureReport(1);
      const angle=decodeAngle(report);
      if(angle!==null)useAngle(angle);
    }catch(e){ /* Input report event still works on supported devices */ }
    finally{polling=false}
  },65);
}
function isLidSensor(d){
  return d.vendorId===0x05ac && d.productId===0x8104 &&
         d.collections.some(c=>c.usagePage===0x20&&c.usage===0x8a);
}
async function autoConnectHinge(){
  if(!navigator.hid)return;
  try{
    const devices=await navigator.hid.getDevices();
    const found=devices.find(isLidSensor);
    if(found)await openHidDevice(found);
  }catch(e){}
}
async function requestHinge(){
  audioReady();
  if(!navigator.hid)return;
  try{
    const devices=await navigator.hid.requestDevice({filters:[{vendorId:0x05ac,productId:0x8104,usagePage:0x20,usage:0x8a}]});
    const device=devices.find(isLidSensor)||devices[0];
    if(device)await openHidDevice(device);
  }catch(e){console.debug('No hinge device permission',e)}
}
$('#sensorButton').addEventListener('pointerdown',e=>e.stopPropagation());
$('#sensorButton').addEventListener('click',e=>{e.stopPropagation();requestHinge();});
$('#sensorButton').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();requestHinge();}});
autoConnectHinge();

// Optional native bridge on loopback port; reconnect if helper comes up later.
function connectBridge(){
  try{
    if(bridge&&(bridge.readyState===0||bridge.readyState===1))return;
    bridge=new WebSocket('ws://127.0.0.1:8766');
    bridge.onmessage=e=>{try{useAngle(Number(JSON.parse(e.data).angle))}catch(_){}};
    bridge.onerror=()=>{};
  }catch(e){}
}
connectBridge();setInterval(()=>{if(!hasLiveSensor)connectBridge()},4000);

function tick(now){
  const dt=Math.max(0,Math.min(.10,(now-lastFrame)/1000));lastFrame=now;
  if(reserve>0){
    watchTime+=dt*1000;
    reserve=Math.max(0,reserve-dt/(180));
  }
  const time=new Date(watchTime);
  const s=time.getSeconds()+time.getMilliseconds()/1000;
  const m=time.getMinutes()+s/60;
  const h=time.getHours()%12+m/60;
  hr.setAttribute('transform',`translate(800 500) rotate(${(h*30).toFixed(5)})`);
  mn.setAttribute('transform',`translate(800 500) rotate(${(m*6).toFixed(5)})`);
  sc.setAttribute('transform',`translate(800 500) rotate(${(s*6).toFixed(5)})`);
  // Smoothly advances one complete orbit in 60 s while charged.
  if(reserve>0)drawTicks(s/60);
  requestAnimationFrame(tick);
}
drawTicks((watchTime/1000)%60/60);
requestAnimationFrame(tick);

// No text or visible controls. Drag/scroll are quiet fallback inputs for preview.
svg.addEventListener('pointerdown',e=>{
  if(e.target.closest('#sensorButton'))return;
  audioReady();dragging=true;lastDragY=e.clientY;svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(!dragging)return;windBy((e.clientY-lastDragY)*.65);lastDragY=e.clientY;
});
svg.addEventListener('pointerup',()=>dragging=false);
svg.addEventListener('pointercancel',()=>dragging=false);
svg.addEventListener('wheel',e=>{
  e.preventDefault();audioReady();windBy(e.deltaY*.055);
},{passive:false});
svg.addEventListener('dblclick',()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});
document.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if(['arrowup','arrowdown',' '].includes(key)){e.preventDefault();audioReady();windBy(8)}
  if(key==='h')requestHinge();
  if(key==='d')reserve=0;
  if(key==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  if(key==='s'){
    const clone=svg.cloneNode(true);
    clone.removeAttribute('style');
    clone.querySelector('#sensorButton')?.remove();
    const blob=new Blob(['<?xml version="1.0" encoding="utf-8"?>\n'+new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='tank-dial.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);
  }
});
</script>
