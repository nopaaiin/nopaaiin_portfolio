<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Radial Tank — SVG Dial</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f4f1e8; }
    body { display:grid; place-items:center; }
    svg { display:block; width:100vw; height:100vh; touch-action:none; cursor:grab; }
    svg:active { cursor:grabbing; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
</head>
<body>
  <svg id="dial" xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet"
       aria-label="가로형 방사형 로마 숫자 다이얼">
    <defs>
      <radialGradient id="ivory" cx="48%" cy="43%" r="80%">
        <stop offset="0" stop-color="#fcfbf6"/>
        <stop offset=".65" stop-color="#f5f3ec"/>
        <stop offset="1" stop-color="#eae7df"/>
      </radialGradient>
      <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#081934"/>
        <stop offset=".22" stop-color="#397ba0"/>
        <stop offset=".48" stop-color="#b0d4df"/>
        <stop offset=".66" stop-color="#1c5686"/>
        <stop offset="1" stop-color="#07172f"/>
      </linearGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity=".22"/>
      </filter>
    </defs>
    <rect width="1600" height="1000" fill="url(#ivory)"/>
    <rect x="12" y="12" width="1576" height="976" fill="none"
          stroke="#d5d2ca" stroke-width="1"/>
    <g id="numerals" fill="#0b0c0f" fill-rule="evenodd"></g>
    <g id="rail" fill="none" stroke="#111216">
      <rect x="226" y="226" width="1148" height="548" stroke-width="2.2"/>
      <rect x="255" y="255" width="1090" height="490" stroke-width="2.2"/>
      <g id="ticks" stroke-width="1.8"></g>
    </g>
    <g id="hands" filter="url(#shadow)">
      <g id="hour" transform="translate(800 500)">
        <path d="M0 18 L-6 -22 L-5 -64 L0 -151 L5 -64 L6 -22 Z"
              fill="url(#steel)" stroke="#0b2442" stroke-width="1"/>
        <path d="M0 -137 L-2 -66 L-2 -22 L0 -12 L2 -22 L2 -66 Z"
              fill="#edf3ef" opacity=".87"/>
      </g>
      <g id="minute" transform="translate(800 500)">
        <path d="M0 22 L-6 -26 L-5 -94 L0 -222 L5 -94 L6 -26 Z"
              fill="url(#steel)" stroke="#082440" stroke-width="1"/>
        <path d="M0 -208 L-2 -96 L-2 -29 L0 -14 L2 -29 L2 -96 Z"
              fill="#edf3ef" opacity=".88"/>
      </g>
      <g id="second" transform="translate(800 500)">
        <path d="M-1.7 39 L-1.7 -203 L0 -233 L1.7 -203 L1.7 39Z" fill="#17456f"/>
        <circle cy="34" r="8" fill="none" stroke="#17456f" stroke-width="2"/>
      </g>
    </g>
    <circle cx="800" cy="500" r="10" fill="#0b2749"/>
    <circle cx="800" cy="500" r="4.2" fill="#397da4" stroke="#c4dde3" stroke-width=".7"/>
  </svg>

  <script>
    'use strict';
    const $ = (selector) => document.querySelector(selector);
    const NS = 'http://www.w3.org/2000/svg';
    const svg = $('#dial');

    // 두 사각형은 중심이 같고, 사방에서 일정 거리만큼 인셋되어 있다.
    const outerRect = { x:20, y:20, width:1560, height:960 };
    const innerRect = { x:208, y:208, width:1184, height:584 };
    const roman = ['I','II','III','IIII','V','VI','VII','VIII','IX','X','XI','XII'];
    const widths = [4.8,8.8,12.6,14.1,8.4,12.6,13.6,14.4,11.7,8.8,12.6,13.9];
    const deg = Math.PI / 180;
    const lerp = (a,b,t) => a + (b-a)*t;

    // (1) 정확한 방사형 사각형 매핑. rotate() 미사용.
    function warpPoint(u, v, theta, w, innerRect, outerRect) {
      const cx = outerRect.x + outerRect.width / 2;
      const cy = outerRect.y + outerRect.height / 2;
      const a = theta - w + 2 * w * u;
      const dx = Math.sin(a);
      const dy = -Math.cos(a);

      function rayHit(rect) {
        const hw = rect.width / 2;
        const hh = rect.height / 2;
        const t = Math.min(
          hw / Math.max(Math.abs(dx), 1e-12),
          hh / Math.max(Math.abs(dy), 1e-12)
        );
        return { x: cx + t * dx, y: cy + t * dy };
      }

      const pin = rayHit(innerRect);
      const pout = rayHit(outerRect);
      return {
        x: pin.x + (pout.x - pin.x) * v,
        y: pin.y + (pout.y - pin.y) * v
      };
    }

    // (2) opentype.js의 M/L/Q/C/Z 명령을 직선 표본으로 분해.
    // 곡선 한 세그먼트를 충분히 촘촘히 샘플링하여 path로 재구성한다.
    function flattenOutline(commands) {
      const contours = [];
      let points = [];
      let x = 0, y = 0, sx = 0, sy = 0;
      const add = (px,py) => points.push([px,py]);
      const finish = () => {
        if (points.length > 2) contours.push(points);
        points = [];
      };
      for (const c of commands) {
        if (c.type === 'M') {
          finish(); x = sx = c.x; y = sy = c.y; add(x,y);
        } else if (c.type === 'L') {
          x = c.x; y = c.y; add(x,y);
        } else if (c.type === 'Q') {
          const x0=x, y0=y;
          const span = Math.hypot(c.x-x0, c.y-y0) + Math.hypot(c.x1-x0,c.y1-y0);
          const n = Math.max(12, Math.ceil(span / 11));
          for (let j=1; j<=n; j++) {
            const t=j/n, q=1-t;
            add(q*q*x0 + 2*q*t*c.x1 + t*t*c.x,
                q*q*y0 + 2*q*t*c.y1 + t*t*c.y);
          }
          x=c.x; y=c.y;
        } else if (c.type === 'C') {
          const x0=x, y0=y;
          const span = Math.hypot(c.x-x0,c.y-y0) + Math.hypot(c.x1-x0,c.y1-y0)
                     + Math.hypot(c.x2-c.x1,c.y2-c.y1);
          const n = Math.max(16, Math.ceil(span / 11));
          for (let j=1; j<=n; j++) {
            const t=j/n, q=1-t;
            add(q*q*q*x0 + 3*q*q*t*c.x1 + 3*q*t*t*c.x2 + t*t*t*c.x,
                q*q*q*y0 + 3*q*q*t*c.y1 + 3*q*t*t*c.y2 + t*t*t*c.y);
          }
          x=c.x; y=c.y;
        } else if (c.type === 'Z') {
          finish(); x=sx; y=sy;
        }
      }
      finish();
      return contours;
    }

    // (3) Playfair Display의 글리프를 path로 추출하고 정규화한 뒤 왜곡.
    function drawRomanNumerals(font) {
      const group = $('#numerals');
      group.replaceChildren();
      roman.forEach((label, index) => {
        const i = index + 1;
        const theta = i * 30 * deg; // XII = 360° = 0°, 시계방향
        const w = widths[index] * deg;
        const glyphPath = font.getPath(label, 0, 0, 1000, { kerning:true });
        const box = glyphPath.getBoundingBox();
        const bw = Math.max(1,box.x2-box.x1);
        const bh = Math.max(1,box.y2-box.y1);
        const contours = flattenOutline(glyphPath.commands);
        const d = contours.map(contour => {
          const points = contour.map(([x,y]) => {
            const u = (x-box.x1) / bw;
            const v = (box.y2-y) / bh; // 아래=0, 위=1
            const p = warpPoint(u,v,theta,w,innerRect,outerRect);
            return `${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
          });
          return `M ${points.join(' L ')} Z`;
        }).join(' ');
        const path = document.createElementNS(NS,'path');
        path.setAttribute('d',d);
        path.setAttribute('fill-rule','evenodd');
        path.dataset.hour = String(i);
        group.appendChild(path);
      });
    }

    const FONT_URL =
      'https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.3.0/files/playfair-display-latin-700-normal.woff';
    async function initFont() {
      try {
        if (!window.opentype) throw new Error('opentype.js 라이브러리 로딩 실패');
        const res = await fetch(FONT_URL);
        if (!res.ok) throw new Error('폰트 다운로드 실패: '+res.status);
        const font = window.opentype.parse(await res.arrayBuffer());
        drawRomanNumerals(font);
      } catch (e) {
        console.error('방사형 글리프를 생성하지 못했습니다.',e);
      }
    }
    initFont();

    // (4) 철도형 레일: 사각형 안쪽에 60개 눈금. 사각형은 고정,
    // 눈금만 둘레를 따라 이동한다.
    const midRail = { x:240.5, y:240.5, width:1119, height:519 };
    const perimeter = 2*(midRail.width + midRail.height);
    const tickGroup = $('#ticks');
    const tickEls = Array.from({length:60},()=>{
      const line = document.createElementNS(NS,'line');
      tickGroup.appendChild(line);
      return line;
    });
    function pointOnRail(distance) {
      const r=midRail, p=perimeter;
      let s = ((distance + r.width/2) % p + p) % p;
      if (s < r.width) return {x:r.x+s,y:r.y,nx:0,ny:1};
      s -= r.width;
      if (s < r.height) return {x:r.x+r.width,y:r.y+s,nx:-1,ny:0};
      s -= r.height;
      if (s < r.width) return {x:r.x+r.width-s,y:r.y+r.height,nx:0,ny:-1};
      s -= r.width;
      return {x:r.x,y:r.y+r.height-s,nx:1,ny:0};
    }
    function drawTicks(offset) {
      tickEls.forEach((el,i)=>{
        const p=pointOnRail(i*perimeter/60+offset);
        const len=(i%5===0)?27:25;
        el.setAttribute('x1',(p.x-p.nx*len/2).toFixed(2));
        el.setAttribute('y1',(p.y-p.ny*len/2).toFixed(2));
        el.setAttribute('x2',(p.x+p.nx*len/2).toFixed(2));
        el.setAttribute('y2',(p.y+p.ny*len/2).toFixed(2));
      });
    }
    drawTicks(0);

    // (5) 이전 시계의 파워리저브, 초침, 와인딩 사운드 보존.
    let reserve = 0.45; // 0~1
    let watchTime = Date.now();
    let travel = 0;
    let lastTime = performance.now();
    let lastAngle = null;
    let audio = null, noise = null;
    let dragging = false, previousY = 0;

    function activateAudio() {
      try {
        audio ||= new (window.AudioContext || window.webkitAudioContext)();
        audio.resume();
        if (!noise) {
          noise = audio.createBuffer(1, Math.floor(audio.sampleRate*.05),audio.sampleRate);
          const a=noise.getChannelData(0);
          for (let i=0;i<a.length;i++) a[i] = Math.random()*2-1;
        }
      } catch(e) { console.warn('오디오가 비활성화되어 있습니다.',e); }
    }
    function ratchet(n=1) {
      if (!audio || audio.state!=='running' || !noise) return;
      const start=audio.currentTime;
      for(let i=0;i<Math.min(5,n);i++) {
        const at=start+i*.018;
        const source=audio.createBufferSource(); source.buffer=noise;
        const filter=audio.createBiquadFilter();filter.type='bandpass';
        filter.frequency.value=1600+(i%3)*260;filter.Q.value=.8;
        const gain=audio.createGain();
        gain.gain.setValueAtTime(.0001,at);
        gain.gain.exponentialRampToValueAtTime(.095,at+.002);
        gain.gain.exponentialRampToValueAtTime(.0001,at+.024);
        source.connect(filter).connect(gain).connect(audio.destination);
        source.start(at);source.stop(at+.03);
      }
    }
    function wind(delta) {
      const motion=Math.abs(delta);
      if (motion<.25 || motion>50) return;
      reserve=Math.min(1,reserve+motion/700);
      travel += motion;
      if(travel>1.5) {
        ratchet(Math.min(5,Math.ceil(travel/2.5)));
        travel=0;
      }
    }
    function onHingeAngle(angle) {
      if (!Number.isFinite(angle) || angle<0 || angle>180) return;
      if(lastAngle!==null) wind(angle-lastAngle);
      lastAngle=angle;
    }
    // WebSocket 브리지 선택 사항. macOS 네이티브 헬퍼가 보내는
    // {"angle": 112.3} 형식의 실시간 데이터를 읽는다.
    function tryBridge() {
      try {
        const ws=new WebSocket('ws://127.0.0.1:8766');
        ws.addEventListener('message', e=>{
          try { onHingeAngle(Number(JSON.parse(e.data).angle)); } catch(_) {}
        });
        ws.addEventListener('error',()=>{});
      } catch(_) {}
    }
    tryBridge();

    function animate(now) {
      const dt=Math.min(.08,Math.max(0,(now-lastTime)/1000));
      lastTime=now;
      if(reserve>0) {
        watchTime+=dt*1000;
        reserve=Math.max(0,reserve-dt/(12*60)); // 만충 시 약 12분
      }
      const time=new Date(watchTime);
      const sec=time.getSeconds()+time.getMilliseconds()/1000;
      const min=time.getMinutes()+sec/60;
      const hr=(time.getHours()%12)+min/60;
      $('#hour').setAttribute('transform',`translate(800 500) rotate(${hr*30})`);
      $('#minute').setAttribute('transform',`translate(800 500) rotate(${min*6})`);
      $('#second').setAttribute('transform',`translate(800 500) rotate(${sec*6})`);
      if(reserve>0) drawTicks(((watchTime/1000)%60)/60*perimeter);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // 시뮬레이션: 드래그·휠·화살표 / D=동력 소진 / S=SVG 저장 / F=전체화면.
    svg.addEventListener('pointerdown',e=>{
      activateAudio();dragging=true;previousY=e.clientY;
      svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove',e=>{
      if(!dragging)return;
      wind((e.clientY-previousY)*.5);previousY=e.clientY;
    });
    svg.addEventListener('pointerup',()=>dragging=false);
    svg.addEventListener('pointercancel',()=>dragging=false);
    svg.addEventListener('wheel',e=>{
      e.preventDefault();activateAudio();wind(e.deltaY*.045);
    },{passive:false});
    document.addEventListener('keydown',e=>{
      if(['ArrowUp','ArrowDown',' ','d','D','s','S','f','F'].includes(e.key)) {
        activateAudio();
        if(['ArrowUp','ArrowDown',' '].includes(e.key)) {
          e.preventDefault();wind(7);
        }
        if(e.key.toLowerCase()==='d') reserve=0;
        if(e.key.toLowerCase()==='f') document.fullscreenElement
          ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        if(e.key.toLowerCase()==='s') saveSvg();
      }
    });
    function saveSvg() {
      const clone=svg.cloneNode(true);
      clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
      const xml='<?xml version="1.0" encoding="UTF-8"?>\n'
        + new XMLSerializer().serializeToString(clone);
      const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml'}));
      const a=document.createElement('a');a.href=url;a.download='radial-tank.svg';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
  </script>
</body>
</html>
