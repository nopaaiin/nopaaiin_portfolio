    <circle id="sensorLight" cx="1564" cy="965" r="3.6" fill="#a3a59e" opacity=".55"/>
  </g>
</svg>
<div id="sensorDiagnostics" hidden role="status" aria-live="polite"><div class="actions"><strong>힌지 센서 진단</strong><span><button id="retryHinge" type="button">센서 연결</button> <button id="hideDiagnostics" type="button">닫기</button></span></div><pre id="sensorDebugOutput"></pre></div>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const svg=$('#face');
const hr=$('#hourHand'),mn=$('#minuteHand'),sc=$('#secondHand');
const sensorLight=$('#sensorLight');

// Track is a perfect, closed two-rectangle drawing. Only the cross-ties travel.
const ticks=$('#railTicks');
const tickItems=Array.from(ticks.querySelectorAll('line'));
const OUTER_RAIL={x:204,y:204,w:1192,h:592};
const INNER_RAIL={x:234,y:234,w:1132,h:532};
const railPerimeter=2*(OUTER_RAIL.w+OUTER_RAIL.h);
// Keep all straight-edge railroad ties perpendicular to the rails.
// Only the four small corner zones become diagonal; both endpoints
// always terminate on real, unbroken rectangle paths.
function railPoints(dist){
  const r=OUTER_RAIL,inn=INNER_RAIL;
  let s=((dist%railPerimeter)+railPerimeter)%railPerimeter;
  let outer,inner;
  if(s<r.w){
    const x=r.x+s;
    outer={x,y:r.y};inner={x:Math.max(inn.x,Math.min(inn.x+inn.w,x)),y:inn.y};
  }else if((s-=r.w)<r.h){
    const y=r.y+s;
    outer={x:r.x+r.w,y};inner={x:inn.x+inn.w,y:Math.max(inn.y,Math.min(inn.y+inn.h,y))};
  }else if((s-=r.h)<r.w){
    const x=r.x+r.w-s;
    outer={x,y:r.y+r.h};inner={x:Math.max(inn.x,Math.min(inn.x+inn.w,x)),y:inn.y+inn.h};
  }else{
    s-=r.w;
    const y=r.y+r.h-s;
    outer={x:r.x,y};inner={x:inn.x,y:Math.max(inn.y,Math.min(inn.y+inn.h,y))};
  }
  return {a:outer,b:inner};
}
function drawTicks(phase){
  const offset=((phase%1)+1)%1*railPerimeter;
  for(let i=0;i<60;i++){
    const p=railPoints(i*railPerimeter/60+offset),line=tickItems[i];
    line.setAttribute('x1',p.a.x.toFixed(2));
    line.setAttribute('y1',p.a.y.toFixed(2));
    line.setAttribute('x2',p.b.x.toFixed(2));
    line.setAttribute('y2',p.b.y.toFixed(2));
  }
}
let runUntil=performance.now()+4000;
let watchTime=Date.now();
let lastTickSecond=Math.floor(watchTime/1000);
let lastFrame=performance.now();
let lastHinge=null;
let movementCount=0;
let strokeDir=0,strokeTravel=0,strokeCounted=false,lastMotionAt=0;
const MIN_STROKE_DEG=4;
const STROKE_GAP_MS=1400;
let audio=null,noise=null,lastCreakAt=0;
let dragging=false,lastDragY=0,dragDistance=0;
let sensor=null,bridge=null,hasLiveSensor=false;
let reportCount=0,lastReportAt=0,lastRaw='없음',sensorStatus='연결되지 않음';
const diagPanel=$('#sensorDiagnostics'),diagText=$('#sensorDebugOutput');
function setStatus(message){sensorStatus=message;updateDiagnostics();}
function showDiagnostics(){diagPanel.hidden=false;updateDiagnostics();}
function updateDiagnostics(){
  if(diagPanel.hidden)return;
  const remaining=Math.max(0,(runUntil-performance.now())/1000).toFixed(1);
  const age=lastReportAt?((performance.now()-lastReportAt)/1000).toFixed(1)+'초 전':'없음';
  diagText.textContent='상태: '+sensorStatus+'\nHID 지원: '+(!!navigator.hid)+'\n장치 열린 상태: '+(!!sensor?.opened)+'\n수신 리포트: '+reportCount+'개 ('+age+')\n마지막 데이터: '+lastRaw+'\n힌지 각도: '+(lastHinge===null?'없음':lastHinge.toFixed(1)+'°')+'\n와인딩: '+movementCount+'/3\n시계 남은 시간: '+remaining+'초\n\nH: 연결 요청 / I: 진단창 / 드래그 3회: 수동 시험';
}
setInterval(updateDiagnostics,200);
$('#hideDiagnostics').addEventListener('click',()=>{diagPanel.hidden=true});
$('#retryHinge').addEventListener('click',()=>requestHinge());

function audioReady(){
  try{
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!Context)return;
    audio??=new Context();
    if(audio.state!=='running')audio.resume().catch(()=>{});
    if(!noise){
      noise=audio.createBuffer(1,Math.ceil(audio.sampleRate*.15),audio.sampleRate);
      const data=noise.getChannelData(0);
      for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
    }
  }catch(e){}
}


// Fine, dry mechanical tick: a filtered impulse and a very brief metallic click.
// A tick occurs only when the virtual second hand actually advances.
// Use Web Audio rather than an external file; the browser unlocks audio after a gesture.
function playWatchTick(secondIndex){
  if(!audio||audio.state!=='running'||!noise)return;
  const t=audio.currentTime+.002;
  const alternate=secondIndex%2===1;
  const src=audio.createBufferSource();src.buffer=noise;
  const band=audio.createBiquadFilter();
  band.type='bandpass';
  band.frequency.value=alternate?1920:2520;
  band.Q.value=1.15;
  const env=audio.createGain();
  env.gain.setValueAtTime(.0001,t);
  env.gain.exponentialRampToValueAtTime(alternate?.028:.034,t+.0012);
  env.gain.exponentialRampToValueAtTime(.0001,t+.030);
  src.connect(band).connect(env).connect(audio.destination);
  src.start(t);src.stop(t+.035);

  const osc=audio.createOscillator();
  osc.type='triangle';
  osc.frequency.setValueAtTime(alternate?1110:1430,t);
  osc.frequency.exponentialRampToValueAtTime(alternate?820:1080,t+.022);
  const tonal=audio.createGain();
  tonal.gain.setValueAtTime(.0001,t);
  tonal.gain.exponentialRampToValueAtTime(.010,t+.001);
  tonal.gain.exponentialRampToValueAtTime(.0001,t+.024);
  osc.connect(tonal).connect(audio.destination);
  osc.start(t);osc.stop(t+.028);
}
// Browsers require one genuine interaction before starting any audio playback.
document.addEventListener('pointerdown',audioReady,{capture:true});
document.addEventListener('keydown',audioReady,{capture:true});

// Frictional "끼릭끼릭": two gritty pulses and a short bending squeak.
// Called only for measured hinge changes (or explicit manual testing).
function creakStep(magnitude,direction){
  if(!audio||audio.state!=='running'||!noise)return;
  const now=performance.now();
  if(now-lastCreakAt<55)return;
  lastCreakAt=now;
  const t=audio.currentTime;
  const duration=Math.min(.12,.075+Math.abs(magnitude)*.003);
  const src=audio.createBufferSource();src.buffer=noise;
  const scratch=audio.createBiquadFilter();scratch.type='bandpass';
  scratch.frequency.setValueAtTime(direction>0?1650:1350,t);
  scratch.Q.value=.9;
  const env=audio.createGain();
  env.gain.setValueAtTime(.0001,t);
  env.gain.exponentialRampToValueAtTime(.048,t+.005);
  env.gain.exponentialRampToValueAtTime(.004,t+.027);
  env.gain.exponentialRampToValueAtTime(.037,t+.039);
  env.gain.exponentialRampToValueAtTime(.0001,t+duration);
  src.connect(scratch).connect(env).connect(audio.destination);
  src.start(t);src.stop(t+duration+.01);

  const osc=audio.createOscillator();
  osc.type='sawtooth';
  const f=direction>0?220:310;
  osc.frequency.setValueAtTime(f,t);
  osc.frequency.exponentialRampToValueAtTime(direction>0?375:185,t+duration);
  const tonal=audio.createBiquadFilter();tonal.type='bandpass';
  tonal.frequency.value=550;tonal.Q.value=2.5;
  const gain=audio.createGain();
  gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(.009,t+.009);
  gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
  osc.connect(tonal).connect(gain).connect(audio.destination);
  osc.start(t);osc.stop(t+duration+.01);
}

function registerStroke(){
  movementCount++;
  updateDiagnostics();
  if(movementCount>=3){
    movementCount=0;
    runUntil=performance.now()+10000;
  }
}
function useAngle(angle){
  if(!Number.isFinite(angle)||angle<0||angle>180)return;
  hasLiveSensor=true;
  sensorLight.setAttribute('fill','#3b7692');
  sensorLight.setAttribute('opacity','.75');
  if(lastHinge===null){lastHinge=angle;return;}
  const delta=angle-lastHinge;
  lastHinge=angle;
  const motion=Math.abs(delta);
  if(motion<.35||motion>120)return; // filter tiny jitter, allow slower WebHID reports across large lid movements
  const now=performance.now();
  const dir=Math.sign(delta);
  if(strokeDir!==dir||now-lastMotionAt>STROKE_GAP_MS){
    strokeDir=dir;strokeTravel=0;strokeCounted=false;
  }
  strokeTravel+=motion;
  lastMotionAt=now;
  if(!strokeCounted&&strokeTravel>=MIN_STROKE_DEG){
    strokeCounted=true;
    registerStroke();
  }
  creakStep(motion,dir);
}


function decodeAngle(data){
  // WebHID strips reportId from the DataView. Input Report 1 is a 9-bit
  // little-endian integer in degrees, not a feature report or a percentage.
  if(!data||data.byteLength<2)return null;
  const raw=data.getUint16(0,true)&0x01ff;
  return raw>=0&&raw<=180?raw:null;
}
function listenInput(e){
  reportCount++;
  lastReportAt=performance.now();
  lastRaw='ID '+e.reportId+' · '+Array.from(new Uint8Array(e.data.buffer,e.data.byteOffset,e.data.byteLength)).map(x=>x.toString(16).padStart(2,'0')).join(' ');
  if(e.reportId!==1){setStatus('연결됨 / 예상 외 리포트 '+e.reportId);return;}
  const angle=decodeAngle(e.data);
  if(angle===null){setStatus('연결됨 / 데이터 해석 실패');return;}
  setStatus('센서 데이터 수신 중');
  useAngle(angle);
  updateDiagnostics();
}
function isLidSensor(d){
  if(!d||d.vendorId!==0x05ac||d.productId!==0x8104)return false;
  const walk=collections=>collections.some(c=>
    (c.usagePage===0x20&&c.usage===0x8a)||walk(c.children||[])
  );
  return walk(d.collections||[]);
}
async function openHidDevice(device){
  if(sensor&&sensor!==device){
    sensor.removeEventListener('inputreport',listenInput);
    if(sensor.opened){try{await sensor.close()}catch(_){}}
  }
  sensor=device;
  if(!device.opened)await device.open();
  device.removeEventListener('inputreport',listenInput);
  device.addEventListener('inputreport',listenInput);
  setStatus('HID 연결됨 — 화면을 천천히 여닫아 주세요 (Input Report 대기)');
  // Do not poll receiveFeatureReport(): this sensor does not advertise any
  // feature reports in the Chrome WebHID descriptor.
  setTimeout(()=>{
    if(sensor===device&&reportCount===0)
      setStatus('HID 연결됨 / 입력 데이터 없음 — 천천히 여닫거나 호환성을 확인하세요');
  },5000);
}
async function autoConnectHinge(){
  if(!navigator.hid){setStatus('Chrome WebHID 사용 불가');return;}
  try{
    const devices=await navigator.hid.getDevices();
    const found=devices.find(isLidSensor);
    if(found)await openHidDevice(found);
    else setStatus('권한이 없음 — H 키 또는 연결 버튼을 누르세요');
  }catch(e){setStatus('자동 연결 오류: '+(e?.message||e));}
}
async function requestHinge(){
  // Called directly in a user key/click handler to preserve user activation.
  audioReady();showDiagnostics();
  if(!navigator.hid){setStatus('브라우저가 WebHID를 지원하지 않음');return;}
  setStatus('Chrome 장치 선택창을 여는 중');
  try{
    const devices=await navigator.hid.requestDevice({filters:[
      {vendorId:0x05ac,productId:0x8104,usagePage:0x20,usage:0x8a}
    ]});
    if(!devices.length){setStatus('선택 취소 또는 센서가 목록에 없음');return;}
    const device=devices.find(isLidSensor);
    if(!device){setStatus('힌지 센서가 아닌 장치입니다');return;}
    await openHidDevice(device);
  }catch(e){
    setStatus('센서 연결 실패: '+(e?.name||'')+' '+(e?.message||e));
    console.warn('Hinge WebHID connection failed',e);
  }
}
$('#sensorButton').addEventListener('pointerdown',e=>e.stopPropagation());
$('#sensorButton').addEventListener('click',e=>{e.stopPropagation();requestHinge();});
$('#sensorButton').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();requestHinge();}});
autoConnectHinge();

// Optional native bridge on loopback port; reconnect if helper comes up later.
function connectBridge(){
  try{
    if(bridge&&(bridge.readyState===0||bridge.readyState===1))return;
    bridge=new WebSocket('ws://127.0.0.1:8766');
    bridge.onmessage=e=>{try{useAngle(Number(JSON.parse(e.data).angle))}catch(_){}};
    bridge.onerror=()=>{};
  }catch(e){}
}
connectBridge();setInterval(()=>{if(!hasLiveSensor)connectBridge()},4000);


function tick(now){
  // Advance no more than the remaining running time, even across a suspended tab.
  const elapsed=Math.max(0,Math.min(now,runUntil)-Math.min(lastFrame,runUntil));
  lastFrame=now;
  if(elapsed>0){
    watchTime+=elapsed;
    const wholeSecond=Math.floor(watchTime/1000);
    // Never emit queued clicks when returning from a background tab.
    if(wholeSecond>lastTickSecond)playWatchTick(wholeSecond);
    lastTickSecond=wholeSecond;
  }
  const time=new Date(watchTime);
  const s=time.getSeconds()+time.getMilliseconds()/1000;
  const m=time.getMinutes()+s/60;
  const h=time.getHours()%12+m/60;
  hr.setAttribute('transform','translate(800 500) rotate('+(h*30).toFixed(5)+')');
  mn.setAttribute('transform','translate(800 500) rotate('+(m*6).toFixed(5)+')');
  sc.setAttribute('transform','translate(800 500) rotate('+(s*6).toFixed(5)+')');
  if(elapsed>0)drawTicks(s/60);
  requestAnimationFrame(tick);
}
drawTicks(((watchTime/1000)%60)/60);
requestAnimationFrame(tick);


// No written UI. Drag/scroll are *testing fallbacks* until the real sensor works.
svg.addEventListener('pointerdown',e=>{
  if(e.target.closest('#sensorButton'))return;
  audioReady();
  if(hasLiveSensor)return;
  dragging=true;lastDragY=e.clientY;dragDistance=0;
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(!dragging||hasLiveSensor)return;
  const delta=e.clientY-lastDragY;
  lastDragY=e.clientY;
  dragDistance+=Math.abs(delta);
  if(Math.abs(delta)>1)creakStep(Math.abs(delta)*.35,Math.sign(delta));
});
function endDrag(){
  if(dragging&&dragDistance>=25&&!hasLiveSensor)registerStroke();
  dragging=false;dragDistance=0;
}
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);

let wheelLastAt=0,wheelTravel=0,wheelCounted=false;
svg.addEventListener('wheel',e=>{
  e.preventDefault();audioReady();
  if(hasLiveSensor)return;
  const now=performance.now();
  if(now-wheelLastAt>480){wheelTravel=0;wheelCounted=false;}
  wheelLastAt=now;wheelTravel+=Math.abs(e.deltaY);
  if(Math.abs(e.deltaY)>.2)creakStep(Math.abs(e.deltaY)*.04,Math.sign(e.deltaY));
  if(!wheelCounted&&wheelTravel>=45){wheelCounted=true;registerStroke();}
},{passive:false});

svg.addEventListener('dblclick',()=>{
  document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
});
document.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if(['arrowup','arrowdown',' '].includes(key)){
    e.preventDefault();
    if(!e.repeat&&!hasLiveSensor){
      audioReady();
      creakStep(5,key==='arrowdown'?-1:1);
      registerStroke();
    }
  }
  if(key==='h')requestHinge();
  if(key==='i'){diagPanel.hidden=!diagPanel.hidden;updateDiagnostics();}
  if(key==='d'){runUntil=performance.now();movementCount=0;}
  if(key==='f'){
    document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  }
  if(key==='s'){
    const clone=svg.cloneNode(true);
    clone.removeAttribute('style');
    clone.querySelector('#sensorButton')?.remove();
    const blob=new Blob(['<?xml version="1.0" encoding="utf-8"?>\n'+new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='tank-dial.svg';
    a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);
  }
});

</script>
</body>
</html>
