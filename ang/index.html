<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ANG</title>
<meta name="description" content="Open wide, then bite. Your screen is captured. Hands free screenshot tool with MediaPipe Face Landmarker.">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none}
canvas#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(620px,90vw);z-index:5;transition:opacity .35s;background:rgba(10,0,4,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:28px;padding:30px 26px 22px}
#panel.hide{opacity:0;pointer-events:none}
#panel h1{font-size:clamp(64px,13vw,140px);line-height:.85;margin:0 0 12px;letter-spacing:-.06em;font-weight:900;text-shadow:0 4px 0 #ff2f7d,0 0 40px rgba(255,47,125,.45)}
#panel p{margin:0 0 8px;font-size:clamp(14px,2vw,18px)}
#panel p.sub{font-size:13px;opacity:.75;margin-bottom:24px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button.big{font:700 16px/1 "Helvetica Neue",Arial,sans-serif;padding:16px 22px;border-radius:999px;border:0;cursor:pointer;background:#fff;color:#111;box-shadow:0 6px 0 #ff2f7d;transition:transform .1s,box-shadow .1s}
button.big:hover{transform:translateY(2px);box-shadow:0 4px 0 #ff2f7d}
button.big:active{transform:translateY(6px);box-shadow:0 0 0 #ff2f7d}
button.big.ghost{background:#111;color:#fff;box-shadow:0 6px 0 #fff}
#msg{min-height:18px;margin-top:16px;font-size:13px;color:#ffd1e1}
#hint{position:fixed;left:50%;bottom:calc(24vh + 16px);transform:translateX(-50%);font:700 15px "Helvetica Neue",Arial,sans-serif;background:rgba(0,0,0,.75);padding:10px 18px;border-radius:999px;z-index:4;opacity:0;transition:opacity .4s;white-space:nowrap;pointer-events:none}
#hint.on{opacity:1}
#tools{position:fixed;top:14px;left:14px;display:flex;gap:8px;z-index:6;opacity:0;transition:opacity .3s;pointer-events:none}
#tools.on{opacity:1;pointer-events:auto}
#tools button{height:40px;min-width:40px;border-radius:999px;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;display:flex;align-items:center;gap:7px;padding:0 12px;font:700 13px "Helvetica Neue",Arial,sans-serif}
#tools button:hover{background:rgba(255,47,125,.9)}
#tools button.pink{background:#ff2f7d}
#tools svg{width:18px;height:18px;flex:none}
#gallery{position:fixed;top:14px;right:14px;bottom:14px;width:min(210px,30vw);z-index:6;background:rgba(10,0,4,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px;display:flex;flex-direction:column;opacity:0;transform:translateX(20px);transition:opacity .3s,transform .3s;pointer-events:none}
#gallery.on{opacity:1;transform:none;pointer-events:auto}
#gallery header{padding:14px 14px 10px;font:900 13px "Helvetica Neue",Arial,sans-serif;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
#gallery header b{color:#ff2f7d;font-size:20px}
#shots{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
#shots a{display:block;color:#fff;text-decoration:none;font-size:11px;opacity:.9}
#shots img{display:block;width:100%;border-radius:8px;margin-bottom:4px}
#shots .empty{font-size:12px;opacity:.6;line-height:1.5;padding:4px 2px}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);font-size:13px;padding:9px 15px;border-radius:999px;z-index:7;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:80vw}
#toast.on{opacity:1}
video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="panel">
  <h1>ANG</h1>
  <p>Open wide, then bite. Your screen is captured.</p>
  <p class="sub">A hands free screenshot tool. No more Cmd + Shift + 4.</p>
  <div class="btns">
    <button class="big" id="btnScreen">Choose a screen</button>
    <button class="big ghost" id="btnDesk">Try it here first</button>
  </div>
  <div id="msg"></div>
</div>

<div id="tools">
  <button id="btnFloat" class="pink" title="Float a small window over other apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="7" rx="1" fill="currentColor"/></svg>Float</button>
  <button id="btnRepick" title="Choose another screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
  <button id="btnSound" title="Sound on/off"><svg id="icoSound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></button>
</div>

<aside id="gallery" aria-label="Captured bites">
  <header><span>BITES</span><b id="count">0</b></header>
  <div id="shots"><div class="empty">Open wide, then bite.<br>Each bite saves a PNG to your Downloads.</div></div>
</aside>

<div id="hint"></div>
<div id="toast"></div>

<video id="cam" playsinline muted autoplay></video>
<video id="scr" playsinline muted autoplay></video>
<video id="pipv" playsinline muted autoplay></video>

<script type="module">
/* ANG : open wide, bite, captured.
   MediaPipe Face Landmarker (jawOpen blendshape + inner lip distance) */

const MP_VER = "0.10.14";
const params = new URLSearchParams(location.search);
const LIB_URL = params.get("lib") || `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const cv = $("stage"), ctx = cv.getContext("2d");
const camV = $("cam"), scrV = $("scr"), pipV = $("pipv");
const panel = $("panel"), msg = $("msg"), hintEl = $("hint"), tools = $("tools"), toastEl = $("toast");
const gallery = $("gallery"), shotsEl = $("shots"), countEl = $("count");
const canShare = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
const pipVideoOK = !!(document.pictureInPictureEnabled || pipV.webkitSupportsPresentationMode);
if (!canShare) { $("btnScreen").style.display = "none"; $("btnRepick").style.display = "none"; }

/* ---------- assets ---------- */
const imgTop = new Image(); imgTop.src = "./assets/teeth_top.png";
const imgBot = new Image(); imgBot.src = "./assets/teeth_bottom.png";
const TOP_H = 245, BOT_H = 277;
function strip(img, fromBottom) {
  const c = document.createElement("canvas"); c.width = 18; c.height = 1;
  c.getContext("2d").drawImage(img, 0, fromBottom ? img.naturalHeight - 6 : 0, img.naturalWidth, 6, 0, 0, 18, 1);
  return c;
}
let stripTop = null, stripBot = null;
imgTop.onload = () => stripTop = strip(imgTop, false);
imgBot.onload = () => stripBot = strip(imgBot, true);

/* ---------- size ---------- */
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
addEventListener("resize", resize); resize();
const pipC = document.createElement("canvas"); pipC.width = 640; pipC.height = 400;
const pctx = pipC.getContext("2d");

/* ---------- state ---------- */
let started = false, source = "desk";
let open = 1, target = 1, faceSeen = 0;
let lastWideAt = -1e9, lastShot = -1e9, shots = 0, firstShotDone = false;
let soundOn = true, keyMode = params.has("key");

/* ---------- face model ---------- */
let faceLM = null, FL = null, files = null, modelReady = false, modelErr = null, cpu = false;
if (!keyMode) (async () => {
  try {
    const mod = await import(`${LIB_URL}/vision_bundle.mjs`);
    FL = mod.FaceLandmarker;
    files = await mod.FilesetResolver.forVisionTasks(`${LIB_URL}/wasm`);
    faceLM = await mk("GPU").catch(() => { cpu = true; return mk("CPU"); });
    modelReady = true;
  } catch (e) { modelErr = e; console.error(e); }
})();
function mk(delegate) {
  return FL.createFromOptions(files, {
    baseOptions: { modelAssetPath: params.get("model") || MODEL_URL, delegate },
    runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true
  });
}
let openRef = 0.17, closedRef = 0.02, jawMax = 0.45, lastVT = -1;
function detect(now) {
  if (!modelReady || camV.readyState < 2 || camV.currentTime === lastVT) return;
  lastVT = camV.currentTime;
  let r;
  try { r = faceLM.detectForVideo(camV, now); }
  catch (e) { if (!cpu) { cpu = true; modelReady = false; mk("CPU").then(f => { faceLM = f; modelReady = true; }); } return; }
  if (!r.faceLandmarks || !r.faceLandmarks.length) return;
  const lm = r.faceLandmarks[0];
  const d = (a, b) => Math.hypot(lm[a].x - lm[b].x, lm[a].y - lm[b].y);
  const ratio = d(13, 14) / (d(10, 152) || 1);
  let jaw = 0; const bs = r.faceBlendshapes && r.faceBlendshapes[0];
  if (bs) { const c = bs.categories.find(c => c.categoryName === "jawOpen"); if (c) jaw = c.score; }
  openRef = Math.max(openRef, ratio); openRef += (0.17 - openRef) * 0.0008;
  closedRef = Math.min(closedRef, ratio); closedRef += (0.02 - closedRef) * 0.0008;
  jawMax = Math.max(jawMax, jaw); jawMax += (0.45 - jawMax) * 0.0008;
  const nl = clamp((ratio - closedRef) / Math.max(0.05, openRef - closedRef), 0, 1);
  const nj = clamp((jaw - 0.04) / Math.max(0.15, jawMax - 0.04), 0, 1);
  target = clamp(nl * 0.6 + nj * 0.4, 0, 1);
  faceSeen = now;
}

/* ---------- media ---------- */
let camStream = null, scrStream = null, grabber = null;
async function startCamera() {
  camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  camV.srcObject = camStream; await camV.play().catch(() => {});
}
async function pickScreen() {
  const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30 } }, audio: false, selfBrowserSurface: "exclude", surfaceSwitching: "include" });
  stopScreen(); scrStream = s; scrV.srcObject = s; await scrV.play().catch(() => {});
  const track = s.getVideoTracks()[0];
  grabber = ("ImageCapture" in window) ? new ImageCapture(track) : null;
  source = "screen";
  track.addEventListener("ended", () => { stopScreen(); source = "desk"; toast("Screen sharing stopped. Bites now capture the demo desktop."); });
}
function stopScreen() { if (scrStream) scrStream.getTracks().forEach(t => t.stop()); scrStream = null; grabber = null; }

async function begin(withScreen) {
  ensureAudio(); msg.textContent = "";
  if (withScreen && canShare) {
    try { await pickScreen(); } catch (e) { source = "desk"; toast("No screen picked. Try it on the demo desktop first."); }
  } else source = "desk";
  if (!keyMode) {
    try { await startCamera(); }
    catch (e) {
      msg.innerHTML = 'The camera reads your mouth. Allow it and try again,<br>or <a href="#" id="useKey" style="color:#fff">use the space bar</a> to bite.';
      $("useKey").onclick = ev => { ev.preventDefault(); keyMode = true; go(); };
      return;
    }
  }
  go();
}
function go() {
  started = true; panel.classList.add("hide"); tools.classList.add("on"); gallery.classList.add("on");
  if (!pipVideoOK) $("btnFloat").style.display = "none";
}
$("btnScreen").onclick = () => begin(true);
$("btnDesk").onclick = () => begin(false);
$("btnRepick").onclick = async () => { try { await pickScreen(); toast("New screen picked."); } catch (e) {} };
$("btnSound").onclick = () => { soundOn = !soundOn; $("icoSound").style.opacity = soundOn ? 1 : .35; ensureAudio(); };
$("btnFloat").onclick = floatPip;
addEventListener("keydown", e => { if (started && keyMode && e.code === "Space") { e.preventDefault(); keyBite(); } });
addEventListener("beforeunload", () => { stopScreen(); if (camStream) camStream.getTracks().forEach(t => t.stop()); });

/* ---------- picture in picture (floats over other apps) ---------- */
let pipOn = false;
async function floatPip() {
  try {
    if (document.pictureInPictureElement) { await document.exitPictureInPicture(); return; }
    if (!pipV.srcObject) { renderPip(performance.now(), false); pipV.srcObject = pipC.captureStream(30); }
    pipOn = true;
    await pipV.play().catch(() => {});
    if (pipV.requestPictureInPicture) await pipV.requestPictureInPicture();
    else if (pipV.webkitSetPresentationMode) pipV.webkitSetPresentationMode("picture-in-picture");
    toast(source === "screen" ? "Floating. Go to any app, open wide and bite." : "Floating. Pick a screen to capture other apps.");
  } catch (e) { console.warn(e); toast("This browser could not float the window."); }
}
pipV.addEventListener("leavepictureinpicture", () => pipOn = false);
pipV.addEventListener("enterpictureinpicture", () => pipOn = true);

/* ---------- capture ---------- */
const snapC = document.createElement("canvas"), sctx = snapC.getContext("2d");
let bite = null; // animation of the last capture
async function grabFrame() {
  if (source === "screen" && scrStream) {
    if (grabber) { try { const bmp = await grabber.grabFrame(); snapC.width = bmp.width; snapC.height = bmp.height; sctx.drawImage(bmp, 0, 0); if (bmp.close) bmp.close(); return; } catch (e) {} }
    if (scrV.videoWidth) { snapC.width = scrV.videoWidth; snapC.height = scrV.videoHeight; sctx.drawImage(scrV, 0, 0); return; }
  }
  snapC.width = desk.width; snapC.height = desk.height; sctx.drawImage(desk, 0, 0);
}
function thumbWithBite(src) {
  const tw = 360, th = Math.max(1, Math.round(tw * src.height / src.width));
  const c = document.createElement("canvas"); c.width = tw; c.height = th; const x = c.getContext("2d");
  x.drawImage(src, 0, 0, tw, th);
  // bite mark on the top right corner
  x.globalCompositeOperation = "destination-out";
  const r = Math.min(tw, th) * 0.26, cx = tw - r * 0.35, cy = r * 0.35;
  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  for (let i = 0; i < 9; i++) { const a = Math.PI * 0.45 + i / 8 * Math.PI * 0.75; x.beginPath(); x.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, r * 0.16, 0, Math.PI * 2); x.fill(); }
  return c;
}
function stamp() { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
async function shoot(now) {
  lastShot = now; shots++;
  playChomp();
  await grabFrame();
  const thumb = thumbWithBite(snapC);
  bite = { thumb, t0: performance.now() };
  const name = `ang_${stamp()}_${String(shots).padStart(2, "0")}.png`;
  snapC.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    addToGallery(url, thumb, name);
  }, "image/png");
  countEl.textContent = shots;
  if (!firstShotDone) { firstShotDone = true; setTimeout(() => toast(pipOn ? "Saved to Downloads." : "Saved to Downloads. Press Float to use it over other apps."), 600); }
}
function addToGallery(url, thumb, name) {
  const empty = shotsEl.querySelector(".empty"); if (empty) empty.remove();
  const a = document.createElement("a"); a.href = url; a.download = name; a.title = "Download again";
  const im = new Image(); im.src = thumb.toDataURL("image/png"); im.alt = name;
  a.appendChild(im); a.appendChild(document.createTextNode(new Date().toLocaleTimeString()));
  shotsEl.prepend(a);
}
function keyBite() { const now = performance.now(); if (now - lastShot > 600) { open = 0; shoot(now); } }

/* ---------- audio (synthesized) ---------- */
let ac = null;
function ensureAudio() { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} }
function noise(sec) { const b = ac.createBuffer(1, Math.floor(ac.sampleRate * sec), ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
function playChomp() {
  if (!ac || !soundOn) return;
  const t0 = ac.currentTime + 0.005;
  const n = ac.createBufferSource(); n.buffer = noise(0.05);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2200; bp.Q.value = 4;
  const g = ac.createGain(); g.gain.setValueAtTime(0.9, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
  n.connect(bp).connect(g).connect(ac.destination); n.start(t0);
  const n2 = ac.createBufferSource(); n2.buffer = noise(0.25);
  const lp = ac.createBiquadFilter(); lp.type = "bandpass"; lp.frequency.value = 700; lp.Q.value = 0.8;
  const g2 = ac.createGain(); g2.gain.setValueAtTime(0.0001, t0 + 0.02); g2.gain.exponentialRampToValueAtTime(0.6, t0 + 0.04); g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
  n2.connect(lp).connect(g2).connect(ac.destination); n2.start(t0 + 0.02);
  const o = ac.createOscillator(); o.type = "triangle"; o.frequency.setValueAtTime(1800, t0 + 0.05); o.frequency.exponentialRampToValueAtTime(900, t0 + 0.12);
  const g3 = ac.createGain(); g3.gain.setValueAtTime(0.12, t0 + 0.05); g3.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
  o.connect(g3).connect(ac.destination); o.start(t0 + 0.05); o.stop(t0 + 0.16);
}

/* ---------- demo desktop (made up, not any real OS) ---------- */
const desk = document.createElement("canvas"), dctx = desk.getContext("2d");
const files_ = ["homework", "final_FINAL.psd", "DO NOT OPEN", "memes", "portfolio_v38", "taxes??", "ang.png", "deadline.txt"];
const note = "to do:\n1. finish assignment\n2. screenshot this\n3. open wide\n4. bite\n5. check Downloads";
let logo = { x: 80, y: 80, vx: 140, vy: 110, hue: 330 }, cur = { x: 300, y: 200, tx: 300, ty: 200 };
function drawDesk(w, h, t, dt) {
  const scale = DPR;
  if (desk.width !== Math.round(w * scale) || desk.height !== Math.round(h * scale)) { desk.width = Math.round(w * scale); desk.height = Math.round(h * scale); }
  const c = dctx; c.setTransform(scale, 0, 0, scale, 0, 0);
  const g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, "#ffb3cf"); g.addColorStop(.5, "#c7b8ff"); g.addColorStop(1, "#9fe3ff");
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = "rgba(255,255,255,.35)"; for (let x = 20; x < w; x += 28) for (let y = 20; y < h; y += 28) c.fillRect(x, y, 2, 2);
  const iz = clamp(h * 0.09, 36, 64);
  c.font = `600 ${Math.max(11, iz * 0.2)}px Helvetica Neue, Arial`; c.textAlign = "center";
  files_.forEach((f, i) => {
    const x = 30 + (i % 2) * (iz * 1.9), y = 26 + Math.floor(i / 2) * (iz * 1.55); if (y + iz > h - 10) return;
    c.fillStyle = "#ffd25a"; rr(c, x, y + iz * .12, iz * 1.2, iz * .85, 6); c.fill();
    c.fillStyle = "#ffbf1f"; rr(c, x, y, iz * .5, iz * .25, 4); c.fill();
    c.fillStyle = "#222"; c.fillText(f, x + iz * .6, y + iz * 1.22);
  });
  const w1 = { x: w * 0.36, y: h * 0.12, w: Math.min(w * 0.36, 460), h: h * 0.5 }; win(c, w1, "notes.txt");
  c.fillStyle = "#222"; c.textAlign = "left"; c.font = `${clamp(h * 0.028, 12, 20)}px Menlo, monospace`;
  note.slice(0, Math.floor((t / 70) % (note.length + 40))).split("\n").forEach((ln, i) => c.fillText(ln, w1.x + 18, w1.y + 58 + i * clamp(h * 0.042, 18, 30)));
  const w2 = { x: w * 0.6, y: h * 0.42, w: Math.min(w * 0.32, 380), h: h * 0.36 }; win(c, w2, "clock");
  const d = new Date(), p = n => String(n).padStart(2, "0");
  c.fillStyle = "#ff2f7d"; c.textAlign = "center"; c.font = `900 ${clamp(Math.min(w2.h * 0.34, w2.w * 0.19), 18, 96)}px Helvetica Neue, Arial`;
  c.fillText(`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`, w2.x + w2.w / 2, w2.y + w2.h * 0.66);
  const lw = clamp(w * 0.12, 80, 170), lh = lw * 0.45;
  logo.x += logo.vx * dt; logo.y += logo.vy * dt;
  if (logo.x < 0 || logo.x + lw > w) { logo.vx *= -1; logo.hue = (logo.hue + 67) % 360; logo.x = clamp(logo.x, 0, w - lw); }
  if (logo.y < 0 || logo.y + lh > h) { logo.vy *= -1; logo.hue = (logo.hue + 67) % 360; logo.y = clamp(logo.y, 0, h - lh); }
  c.fillStyle = `hsl(${logo.hue} 90% 55%)`; rr(c, logo.x, logo.y, lw, lh, lh / 2); c.fill();
  c.fillStyle = "#fff"; c.font = `900 ${lh * 0.6}px Helvetica Neue, Arial`; c.fillText("ANG", logo.x + lw / 2, logo.y + lh * 0.72);
  if (Math.hypot(cur.tx - cur.x, cur.ty - cur.y) < 8) { cur.tx = Math.random() * w; cur.ty = Math.random() * h; }
  cur.x += (cur.tx - cur.x) * Math.min(1, dt * 2.2); cur.y += (cur.ty - cur.y) * Math.min(1, dt * 2.2);
  c.save(); c.translate(cur.x, cur.y); c.fillStyle = "#fff"; c.strokeStyle = "#000"; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 22); c.lineTo(6, 16); c.lineTo(10, 25); c.lineTo(14, 23); c.lineTo(10, 15); c.lineTo(17, 15); c.closePath(); c.fill(); c.stroke(); c.restore();
}
function win(c, r, title) {
  c.save(); c.shadowColor = "rgba(0,0,0,.25)"; c.shadowBlur = 24; c.shadowOffsetY = 8; c.fillStyle = "#fff"; rr(c, r.x, r.y, r.w, r.h, 12); c.fill(); c.restore();
  c.fillStyle = "#f0eef5"; rr(c, r.x, r.y, r.w, 34, 12); c.fill(); c.fillRect(r.x, r.y + 20, r.w, 14);
  ["#ff6b6b", "#ffd25a", "#57d977"].forEach((col, i) => { c.fillStyle = col; c.beginPath(); c.arc(r.x + 18 + i * 18, r.y + 17, 5.5, 0, 7); c.fill(); });
  c.fillStyle = "#555"; c.font = "600 13px Helvetica Neue, Arial"; c.textAlign = "center"; c.fillText(title, r.x + r.w / 2, r.y + 22);
}

/* ---------- scene (drawn to the page and to the floating window) ---------- */
function layout(w, h, o) {
  const s = (h * 0.24) / TOP_H, hT = TOP_H * s, hB = BOT_H * s, b = 0.07 * hT;
  const uY = lerp(h / 2 + b, hT, o), lY = lerp(h / 2 - b, h - hB, o);
  return { hT, hB, uY, lY, cTop: uY - hT * 0.42, cBot: lY + hB * 0.32, fullTop: hT * 0.58, fullBot: h - hB * 0.68 };
}
function scene(c, w, h, now, armed, isPip) {
  const L = layout(w, h, open);
  c.fillStyle = "#1a0006"; c.fillRect(0, 0, w, h);
  const fullH = L.fullBot - L.fullTop, curH = Math.max(0, L.cBot - L.cTop);
  if (curH > 0.5) {
    if (source === "screen" && scrV.videoWidth) {
      const vw = scrV.videoWidth, vh = scrV.videoHeight, sc = Math.min(w / vw, fullH / vh), dw = vw * sc, dh = vh * sc, k = curH / fullH;
      c.fillStyle = "#111"; c.fillRect(0, L.cTop, w, curH);
      c.drawImage(scrV, 0, 0, vw, vh, (w - dw) / 2, L.cTop + (fullH - dh) / 2 * k, dw, dh * k);
    } else if (desk.width) c.drawImage(desk, 0, 0, desk.width, desk.height, 0, L.cTop, w, curH);
    const sh = Math.min(curH * 0.5, h * 0.11);
    let g = c.createLinearGradient(0, L.uY - 10, 0, L.uY + sh); g.addColorStop(0, "rgba(40,0,10,.55)"); g.addColorStop(1, "rgba(40,0,10,0)");
    c.fillStyle = g; c.fillRect(0, L.cTop, w, Math.min(curH, L.uY + sh - L.cTop));
    g = c.createLinearGradient(0, L.lY + 10, 0, L.lY - sh); g.addColorStop(0, "rgba(40,0,10,.55)"); g.addColorStop(1, "rgba(40,0,10,0)");
    const y0 = Math.max(L.cTop, L.lY - sh); c.fillStyle = g; c.fillRect(0, y0, w, L.cBot - y0);
  }
  if (imgTop.naturalWidth && imgBot.naturalWidth) {
    const topY = L.uY - L.hT, botEnd = L.lY + L.hB;
    if (topY > 0 && stripTop) c.drawImage(stripTop, 0, 0, 18, 1, 0, 0, w, topY + 2);
    c.drawImage(imgTop, 0, topY, w, L.hT);
    c.drawImage(imgBot, 0, L.lY, w, L.hB);
    if (botEnd < h && stripBot) c.drawImage(stripBot, 0, 0, 18, 1, 0, botEnd - 2, w, h - botEnd + 2);
  }
  if (armed) { const lw = Math.max(4, w * 0.008); c.strokeStyle = "#ff2f7d"; c.lineWidth = lw; c.strokeRect(lw / 2, lw / 2, w - lw, h - lw); }
  if (bite) {
    const k = (now - bite.t0) / 1100;
    if (k < 1) {
      if (k < 0.18) { c.fillStyle = `rgba(255,255,255,${0.85 * (1 - k / 0.18)})`; c.fillRect(0, 0, w, h); }
      const e = 1 - Math.pow(1 - k, 3);
      const tw = lerp(w * 0.62, w * 0.16, e), th = tw * bite.thumb.height / bite.thumb.width;
      const x = lerp(w / 2, isPip ? w * 0.84 : w - Math.min(210, w * 0.3) / 2 - 14, e), y = lerp(h / 2, isPip ? h * 0.2 : 120, e);
      c.save(); c.globalAlpha = k > 0.8 ? (1 - k) / 0.2 : 1; c.translate(x, y); c.rotate(lerp(0, 0.12, e));
      c.shadowColor = "rgba(0,0,0,.5)"; c.shadowBlur = 20; c.drawImage(bite.thumb, -tw / 2, -th / 2, tw, th); c.restore();
    }
  }
}
function renderPip(now, armed) {
  const w = pipC.width, h = pipC.height;
  pctx.setTransform(1, 0, 0, 1, 0, 0);
  scene(pctx, w, h, now, armed, true);
  pctx.fillStyle = "rgba(0,0,0,.6)"; rr(pctx, 12, 12, 136, 38, 19); pctx.fill();
  pctx.fillStyle = armed ? "#ff2f7d" : "#fff"; pctx.font = "900 19px Helvetica Neue, Arial"; pctx.textAlign = "left";
  pctx.fillText(armed ? "BITE!" : `BITES ${shots}`, 28, 38);
  if (started && !keyMode && now - faceSeen > 1500) {
    pctx.fillStyle = "rgba(0,0,0,.65)"; rr(pctx, w / 2 - 120, h / 2 - 22, 240, 44, 22); pctx.fill();
    pctx.fillStyle = "#fff"; pctx.textAlign = "center"; pctx.font = "700 18px Helvetica Neue, Arial"; pctx.fillText("show me your face", w / 2, h / 2 + 6);
  }
}

/* ---------- hints & toast ---------- */
let hintCur = "";
function hint(t) { if (t === hintCur) return; hintCur = t; hintEl.textContent = t; hintEl.classList.toggle("on", !!t); }
let toastTimer = 0;
function toast(t) { toastEl.textContent = t; toastEl.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("on"), 3600); }

/* ---------- main tick: driven by a worker so it keeps running behind other apps ---------- */
const ticker = new Worker(URL.createObjectURL(new Blob(["setInterval(()=>postMessage(0),33)"], { type: "text/javascript" })));
let last = performance.now();
ticker.onmessage = () => tick(performance.now());
function tick(now) {
  const dt = Math.min(0.08, (now - last) / 1000); last = now;
  let armed = false;
  if (started) {
    if (keyMode) { target = 1; faceSeen = now; }
    else detect(now);
    const faceOK = now - faceSeen < 600;
    if (!faceOK) target = 1;
    open += (target - open) * (target < open ? Math.min(1, dt * 18) : Math.min(1, dt * 10));
    // gesture: open wide, then bite within 0.7s
    if (!keyMode && faceOK && target > 0.55) lastWideAt = now;
    const ready = now - lastShot > 1500;
    armed = !keyMode && faceOK && now - lastWideAt < 700 && ready;
    if (armed && target < 0.14) shoot(now);
    if (!keyMode && modelErr) { keyMode = true; toast("Face model did not load. Use the space bar to bite."); }
    if (!keyMode && !modelReady) hint("Loading face model...");
    else if (!keyMode && !faceOK) hint("Show me your face");
    else if (!firstShotDone) hint(keyMode ? "Press SPACE to bite" : (armed ? "BITE!" : "Open wide, then bite"));
    else hint("");
  } else open += (1 - open) * Math.min(1, dt * 6);
  if (bite && now - bite.t0 > 1100) bite = null;

  if (source === "desk") drawDesk(W, H * 0.7, now, dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scene(ctx, W, H, now, armed, false);
  if (pipOn || document.pictureInPictureElement) renderPip(now, armed);
}

/* ---------- utils ---------- */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
</script>
